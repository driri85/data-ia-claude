services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8095:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8097:80"
    depends_on:
      backend:
        condition: service_healthy
